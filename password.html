<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Protected</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .container {
    background: #fff;
    padding: 40px;
    border-radius: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
    width: auto;
    animation: fadeIn 0.6s ease;
  }

  h2 {
    margin-bottom: 10px;
    color: #222;
    font-weight: 600;
    font-size: 22px;
  }

  p {
    margin-bottom: 25px;
    color: #666;
    font-size: 15px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  input {
    width: auto;
    padding: 12px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  input:focus {
    border-color: #0078d7;
    box-shadow: 0 0 6px rgba(0,120,215,0.3);
  }

  button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: #1e3a5f;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
  }

  button:hover {
    background: #005a9e;
    transform: translateY(-2px);
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
  }

  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
  }

  .error {
    animation: shake 0.4s;
    border-color: #d9534f !important;
  }
</style>
</head>
<body>
  <div class="container">
    <h2>This case study is confidential</h2>
    <p>Please enter the password shared in my resume to continue</p>
    <form onsubmit="check(); return false;">
      <input type="password" id="pass" placeholder="Enter password">
      <button type="submit">Enter</button>
    </form>
  </div>

<script>
function check() {
  var input = document.getElementById("pass");
  var p = input.value;

  const params = new URLSearchParams(window.location.search);
  const redirectPage = params.get("redirect");

  if(p === "design123") {
    localStorage.setItem("auth","true");
    window.location.href = redirectPage || "index.html";
  } else {
    input.classList.add("error");
    setTimeout(() => input.classList.remove("error"), 500);
    alert("Wrong password");
  }
}
</script>
</body>
</html>
